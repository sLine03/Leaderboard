<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <title>Caught in the Phish</title>
</head>
<body onload="fishMove()">
  <header>
    <h1 class="title">
      Cybersecurity Awareness Month
      <img src="images/Jack.png" class="logoBoard" alt="Logo">
    </h1>
    <h2 class="title">Caught In The Phish Escape Room</h2>
    <hr>
  </header>

  <main>
    <div class="launcher-buttons">
      <button onclick="window.location.href='dashboard.html'">Create New Session</button>
      <button onclick="window.location.href='scoreboard.html'">See Leaderboard</button>
    </div>

    <div id="containerFish">
      <img src="images/GoldfishStickers.png" id="fish" alt="Animated Fish">
    </div>
  </main>

  <script>
    function fishMove() {
      const fish = document.getElementById("fish");
      let pos = 0;
      let direction = 1;
      const maxPos = 900;

      setInterval(() => {
        pos += direction;
        fish.style.left = `${pos}px`;
        fish.style.transform = direction === 1 ? "scaleX(-1)" : "scaleX(1)";
        if (pos >= maxPos || pos <= 0) direction *= -1;
      }, 5);
    }
  </script>
</body>
</html>

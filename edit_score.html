<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <title>Caught in the Phish - Edit Team</title>
</head>
<body>
  <header>
    <h1 class="title">
      Cyber Security Awareness Month
      <img src="images/Jack.png" class="logoBoard" alt="Logo">
    </h1>
    <h2 class="title">Caught in a Phish - Edit Team</h2>
    <hr>
  </header>

  <main>
    <div id="edit-form" class="edit-form-box">
      <p class="text edit-team-name"><strong>Team Name: </strong> <span id="teamName"></span></p>

      <div id="levels-container"></div>

      <label class="text edit-score-label">Score:
        <input type="number" class="input" id="score" min="0">
      </label>

      <div class="modal-buttons edit-form-actions">
        <button onclick="saveChanges()">Save</button>
        <button class="btn-neutral" onclick="window.location.href='scoreboard.html'">Cancel</button>
      </div>
    </div>
  </main>

  <script>
    const TEAMS_KEY = "teams";

    // Accepts "M:SS" (e.g. "1:30") or "H:MM:SS". Returns ms, or null if unparsable.
    function parseDuration(str) {
      if (str == null) return null;
      const trimmed = String(str).trim();
      if (!trimmed) return null;
      const parts = trimmed.split(":");
      if (parts.length < 1 || parts.length > 3 || parts.some(p => !/^\d+(\.\d+)?$/.test(p))) return null;
      let h = 0, m = 0, s = 0;
      if (parts.length === 1) {
        m = parseFloat(parts[0]);
      } else if (parts.length === 2) {
        [m, s] = parts.map(parseFloat);
      } else {
        [h, m, s] = parts.map(parseFloat);
      }
      return (h * 3600 + m * 60 + s) * 1000;
    }
    // Formats ms as "M:SS" (minutes not zero-padded, seconds always 2 digits)
    function formatDuration(ms) {
      const totalSec = Math.round(Math.max(0, ms) / 1000);
      const m = Math.floor(totalSec / 60);
      const s = totalSec % 60;
      return `${m}:${String(s).padStart(2, "0")}`;
    }

    const targetId = localStorage.getItem("editTarget");
    const teams = JSON.parse(localStorage.getItem(TEAMS_KEY)) || [];
    const team = teams.find(t => t.id === targetId);

    if (!team) {
      alert("Team not found.");
      window.location.href = "scoreboard.html";
    }

    document.getElementById("teamName").textContent = team.name;
    document.getElementById("score").value = team.score ?? "";

    const levelsContainer = document.getElementById("levels-container");

    function renderLevels() {
      levelsContainer.innerHTML = "";
      team.levels.forEach((lvl, i) => {
        const row = document.createElement("div");
        row.className = "level-input-row edit-level-row";
        row.innerHTML = `
          <label class="text edit-level-label">Level ${i + 1}:</label>
          <input type="text" class="input level-value" placeholder="1:30" value="${formatDuration(lvl.ms)}" data-index="${i}">
        `;
        levelsContainer.appendChild(row);
      });

      if (team.levels.length === 0) {
        levelsContainer.innerHTML = `<p class="text">No levels recorded for this team yet.</p>`;
      }
    }

    renderLevels();

    function saveChanges() {
      const valueInputs = document.querySelectorAll(".level-value");

      valueInputs.forEach(input => {
        const i = parseInt(input.dataset.index, 10);
        const ms = parseDuration(input.value);
        if (ms == null || ms < 0) {
          alert(`Please enter a valid duration for Level ${i + 1} (e.g. 1:30).`);
          throw new Error("invalid input");
        }
        team.levels[i].ms = ms;
      });

      const scoreInput = document.getElementById("score").value;
      team.score = scoreInput === "" ? null : parseInt(scoreInput, 10);

      localStorage.setItem(TEAMS_KEY, JSON.stringify(teams));
      localStorage.removeItem("editTarget");
      window.location.href = "scoreboard.html";
    }
  </script>
</body>
</html>

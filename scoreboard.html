<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <title>Caught in the Phish - Leaderboard</title>
</head>
<body style="background-image: url('images/jackal_background.png'); background-size: cover; background-position: center; background-repeat: no-repeat;">
  <header>
    <img src="images/GoldfishStickers.png" class="fish" alt="Decorative Fish">
    <img src="images/envelope.png" class="envelope" alt="Envelope">
  </header>

  <main>
    <h1 class="title">
      Leaderboard
    </h1>
    <h2 class="title">Cyber Security Awareness Month - Caught in a Phish Escape Room</h2>
    <hr>

    <h2 class="board-heading">Fastest Time <span class="board-heading-note">(all 4 levels completed)</span></h2>
    <table>
      <thead>
        <tr>
          <th>Rank</th>
          <th>Name</th>
          <th>Total Time</th>
          <th class="edit-col"></th>
        </tr>
      </thead>
      <tbody id="time-table-body"></tbody>
    </table>

    <h2 class="board-heading board-heading-spaced">Highest Score</h2>
    <table>
      <thead>
        <tr>
          <th>Rank</th>
          <th>Name</th>
          <th>Score</th>
          <th class="edit-col"></th>
        </tr>
      </thead>
      <tbody id="score-table-body"></tbody>
    </table>

    <div class="buttons">
      <button id="editToggleBtn">Edit Scores</button>
      <button onclick="window.location.href='display.html'">Display Mode</button>
      <button onclick="newGame()" style="background-color: rgb(97, 170, 97);">New Session</button>
      <button id="resetBtn" style="background-color: #b71c1c;">Reset Leaderboard</button>
      <button id="submitLeaderboard" >Export Leaderboard</button>
    </div>
  </main>

  <script>
    const TEAMS_KEY = "teams";
    const MAX_LEVELS = 4;

    const timeBody = document.getElementById("time-table-body");
    const scoreBody = document.getElementById("score-table-body");
    const resetBtn = document.getElementById("resetBtn");

    function getTeams() {
      return JSON.parse(localStorage.getItem(TEAMS_KEY)) || [];
    }

    function totalMs(team) {
      return team.levels.reduce((sum, lvl) => sum + lvl.ms, 0);
    }

    function formatHMS(ms) {
      const totalSec = Math.max(0, Math.floor(ms / 1000));
      const h = String(Math.floor(totalSec / 3600)).padStart(2, "0");
      const m = String(Math.floor((totalSec % 3600) / 60)).padStart(2, "0");
      const s = String(totalSec % 60).padStart(2, "0");
      return `${h}:${m}:${s}`;
    }

    // Starts a fresh session: resets the clock and gives the game a new sessionId so the
    // dashboard starts with no teams. Teams already recorded stay on this leaderboard.
    function newGame() {
      const game = JSON.parse(localStorage.getItem("game"));
      const inProgress = game && (game.status === "running" || game.status === "paused");
      if (inProgress && !confirm("A session is still in progress. Start a new one? Its clock will be reset, but its teams stay on the leaderboard.")) return;
      localStorage.setItem("game", JSON.stringify({
        status: "not_started",
        durationMs: 45 * 60 * 1000,
        startTime: null,
        accumulatedMs: 0,
        sessionId: Date.now().toString(36) + Math.random().toString(36).slice(2, 7)
      }));
      window.location.href = "dashboard.html";
    }

    resetBtn.addEventListener("click", () => {
      if (confirm("Are you sure you want to reset the leaderboard? This removes all teams.")) {
        localStorage.removeItem(TEAMS_KEY);
        render();
      }
    });

    function goToEdit(id) {
      localStorage.setItem("editTarget", id);
      window.location.href = "edit_score.html";
    }

    document.getElementById("submitLeaderboard").addEventListener("click", submitToGoogleSheet);

    function submitToGoogleSheet() {
      const teams = getTeams();
      if (teams.length === 0) {
        alert("No teams to submit.");
        return;
      }

      const sheetURL = "https://script.google.com/macros/s/AKfycbzOWkugvSGv5VI5l9ywSXxZWag_wBRENS3-CrYXH3WY-WUNel8c0anOuyNjsOsASfIq/exec";

      teams.forEach(team => {
        fetch(sheetURL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name: team.name,
            time: formatHMS(totalMs(team)),
            levelsCompleted: team.levels.length,
            score: team.score
          })
        });
      });

      alert("Leaderboard submitted to Google Sheets!");
    }

    function medalClass(index) {
      if (index === 0) return "first-place";
      if (index === 1) return "second-place";
      if (index === 2) return "third-place";
      return "";
    }

    function render() {
      const teams = getTeams();

      // --- Fastest Time board: only teams that finished all 4 levels ---
      const finished = teams.filter(t => t.levels.length === MAX_LEVELS);
      finished.sort((a, b) => totalMs(a) - totalMs(b));

      timeBody.innerHTML = "";
      if (finished.length === 0) {
        timeBody.innerHTML = `<tr><td colspan="4" style="color: rgba(255, 255, 255, 0.6);">No teams have completed all ${MAX_LEVELS} levels yet.</td></tr>`;
      } else {
        finished.forEach((team, index) => {
          const row = document.createElement("tr");
          const cls = medalClass(index);
          if (cls) row.classList.add(cls);
          row.innerHTML = `
            <td>${index + 1}</td>
            <td>${team.name}</td>
            <td>${formatHMS(totalMs(team))}</td>
            <td class="edit-col"><button id="edit-btn-${team.id}" onclick="goToEdit('${team.id}')" class="edit_button"><img src="images/edit-white-icon.png" class="edit_image" alt="Edit"></button></td>
          `;
          timeBody.appendChild(row);
        });
      }

      // --- Highest Score board: any team with a score entered ---
      const scored = teams.filter(t => t.score !== null && t.score !== undefined);
      scored.sort((a, b) => b.score - a.score);

      scoreBody.innerHTML = "";
      if (scored.length === 0) {
        scoreBody.innerHTML = `<tr><td colspan="4" style="color: rgba(255, 255, 255, 0.6);">No scores entered yet.</td></tr>`;
      } else {
        scored.forEach((team, index) => {
          const row = document.createElement("tr");
          const cls = medalClass(index);
          if (cls) row.classList.add(cls);
          row.innerHTML = `
            <td>${index + 1}</td>
            <td>${team.name}</td>
            <td>${team.score}</td>
            <td class="edit-col"><button onclick="goToEdit('${team.id}')" class="edit_button"><img src="images/edit-white-icon.png" class="edit_image" alt="Edit"></button></td>
          `;
          scoreBody.appendChild(row);
        });
      }
    }

    window.addEventListener("storage", (e) => {
      if (e.key === TEAMS_KEY) render();
    });
    setInterval(render, 3000);

    render();
    
    // "Edit Scores" shows/hides the edit column (hidden by default)
    const editToggleBtn = document.getElementById("editToggleBtn");
    editToggleBtn.addEventListener("click", () => {
      const editing = document.body.classList.toggle("editing");
      editToggleBtn.textContent = editing ? "Done Editing" : "Edit Scores";
    });
  </script>
</body>
</html>
